<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/public/Figma_photos/wandernest.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wandernest</title>

  <!-- Preconnect to external domains for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.pexels.com">
  <link rel="preconnect" href="https://wander-nest-ad3s.onrender.com">

  <!-- DNS prefetch for additional performance -->
  <link rel="dns-prefetch" href="https://images.pexels.com">
  <link rel="dns-prefetch" href="https://wander-nest-ad3s.onrender.com">

  <!-- Preload critical resources -->
  <link rel="preload" href="/Figma_photos/2102331.jpg" as="image" type="image/jpeg">

  <!-- Critical CSS inline for above-the-fold content -->
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: normal;
    }

    #root {
      min-height: 100vh;
    }

    /* Critical loading styles */
    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- Defer non-critical CSS -->
  <link rel="preload" href="/src/global.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="/src/global.css">
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
